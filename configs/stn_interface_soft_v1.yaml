# Experiment G1 — STN Interface-Centered Soft Boundary Supervision v1.
#
# This file is configs/baseline_v1.yaml with EXACTLY these changes:
#   1. loss_type selects the soft-target criterion
#   2. soft_boundary_enabled turns the soft TRAINING target on
#   3. soft_boundary_band_mm fixes the ramp half-width (pre-registered)
#   4. checkpoint_dir / results_dir point at the experiment directories
#   5. pin_memory: false  (environment workaround, NOT an experimental variable)
#
# `augmentation_enabled` is deliberately ABSENT rather than set to false: the
# default is already false, and leaving it out keeps the config diff minimal.
# A test asserts the diff is exactly the five items above.
#
# ---------------------------------------------------------------------------
# WHAT IS AND IS NOT BEING CLAIMED
# ---------------------------------------------------------------------------
# This is NOT partial-volume ground truth. The dataset has no sub-voxel
# annotation, so no true occupancy fraction exists to supervise against. What is
# being tested is whether the HARD ONE-HOT BOUNDARY REPRESENTATION is an
# intervenable factor in the one-voxel STN extent error Experiment G0 measured.
# Experiment G0 found that error is a thin shell at the in-plane sampling limit,
# carried at high confidence (median p_STN 0.960 on false positives), which rules
# out calibration, crop position and class confusion as explanations.
#
# The target is built from a *definition imposed on the discrete mask*: the
# boundary is taken to lie on the shared face between a 6-connected pair of
# voxels that differ in class, which puts it half a voxel spacing from each of
# those two centres. The ramp is linear and centred there.
#
# ---------------------------------------------------------------------------
# WHY THE BAND IS 0.6666667 mm AND NOT SOMETHING ELSE
# ---------------------------------------------------------------------------
# One in-plane voxel spacing. It is NOT tuned, and no sweep is run.
#
# The value is also forced by the geometry rather than chosen freely. A
# voxel-centre signed distance (edt(~mask) - edt(mask)) can only take |d| values
# that are whole voxel spacings, so a band of this half-width would contain NO
# voxel centres at all and the "soft" target would collapse onto the hard label
# -- measured, 0 voxels differ across all 40 development-val cases. Defining the
# distance against the interface instead moves the nearest shell to s/2 and makes
# the band non-degenerate.
#
# Consequently the achievable in-band |d| values are exactly two constants,
# s/2 = 0.33333335 and s*sqrt(2)/2 = 0.471404544, giving q_STN values of
# 0.75 / 0.25 (in-plane adjacent) and 0.853553391 / 0.146446609 (in-plane
# diagonal). The interface itself sits at q = 0.5 mathematically, but no voxel
# centre lands exactly on it.
#
# ---------------------------------------------------------------------------
# WHAT IS DELIBERATELY UNCHANGED
# ---------------------------------------------------------------------------
# The objective is Baseline v1's: CE + foreground macro soft Dice over STN/SN/RN,
# same class set, same smoothing, same per-case averaging, same weights. Only the
# STN component of the training TARGET changes. No Tversky, no boundary term, no
# augmentation, no class weighting, no threshold, no post-processing. Validation
# always uses the original hard ground truth.

# ---- data --------------------------------------------------------------- #
root: "."
cache_dir: "cache/baseline_v1"
manifest_dir: "manifests/experiment"

# ---- model -------------------------------------------------------------- #
base_channels: 16
in_channels: 3
num_classes: 4

# ---- optimisation ------------------------------------------------------- #
seed: 42
batch_size: 2
learning_rate: 3.0e-4
weight_decay: 1.0e-5
amp: true
max_epochs: 200
early_stopping_patience: 40
num_workers: 0
# Environment workaround, NOT an experimental variable.
# This machine has ~15.6 GB of RAM and is heavily loaded; the pinned-memory
# allocator can then fail and PyTorch reports it as "CUDA error: out of memory"
# even with plenty of free VRAM. pin_memory only controls whether host staging
# buffers are page-locked, so setting it false cannot change any weight, loss or
# metric -- the comparison against the baseline stays valid.
pin_memory: false
grad_accumulation_steps: 1
grad_clip_norm: 1.0

# ---- loss --------------------------------------------------------------- #
# THE ONLY ALGORITHMIC CHANGE: the STN component of the training target.
#
#     CE_soft  = -sum_c q_c log softmax(logits)_c
#     Dice     = 1 - mean_cases,classes ( 2*sum(p_c q_c) + eps
#                                       / (sum(p_c) + sum(q_c) + eps) )
#     total    = 1.0 * CE_soft + 1.0 * Dice
#
# which reduces exactly to Baseline v1's loss when q is one-hot. The hard-target
# path calls the baseline's own DiceCELoss directly, so the baseline is unchanged
# structurally rather than by assertion.
loss_type: "stn_interface_soft"
soft_boundary_enabled: true
soft_boundary_band_mm: 0.6666667   # pre-registered; not tuned, no sweep

ce_weight: 1.0          # unchanged from Baseline v1
dice_weight: 1.0        # unchanged from Baseline v1

# ---- bookkeeping -------------------------------------------------------- #
checkpoint_dir: "checkpoints/experiments/stn_interface_soft_v1"
results_dir: "results/experiments/stn_interface_soft_v1"
