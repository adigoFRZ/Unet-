# Experiment D2 -- multi-seed robustness, T1 + QSM @ seed 123.
#
# This file is configs/modality_ablation/t1_qsm.yaml with EXACTLY these changes:
#   1. seed: 123
#   2. checkpoint_dir / results_dir point at the multiseed directories
# Everything else -- modality selection, crop, model, loss, optimiser, lr, batch,
# schedule, split -- is byte-identical to that configuration's seed-42 config, so
# the ONLY difference between seeds within a configuration is the seed.
#
# The train/val split is not seed-dependent: it comes from the frozen manifest
# files, whose sha256 is recorded in each run's environment.json. All runs in
# Experiment D2 read the identical 160/40 split.
#
# pin_memory is false. This is an environment workaround, NOT an experimental
# variable: it only controls whether host staging buffers are page-locked and
# cannot change any weight, loss or metric. (The frozen trimodal seed-42 run
# predates the pin_memory config key and therefore used the default True; this is
# recorded here for transparency -- see the run report.)

# ---- data --------------------------------------------------------------- #
root: "."
cache_dir: "cache/baseline_v1"
manifest_dir: "manifests/subject_clean_v1"

# ---- model -------------------------------------------------------------- #
base_channels: 16          # 16 -> 32 -> 64 -> 128 -> 256
# in_channels is NOT set here -- see the note at the top of this file.
num_classes: 4             # 0 background, 1 STN, 2 SN, 3 RN

# ---- optimisation ------------------------------------------------------- #
seed: 123
batch_size: 2              # provisional; confirmed by the VRAM smoke test
learning_rate: 3.0e-4
weight_decay: 1.0e-5
amp: true
max_epochs: 200
early_stopping_patience: 40
num_workers: 0             # Windows + small cache: keep in-process
# Environment workaround, NOT an experimental variable. This machine has
# ~15.6 GB of RAM and is heavily loaded; the pinned-memory allocator can then
# fail and PyTorch reports it as "CUDA error: out of memory" even with free
# VRAM. pin_memory only controls whether host staging buffers are page-locked,
# so setting it false cannot change any weight, loss or metric.
pin_memory: false
grad_accumulation_steps: 1 # raise if batch_size has to drop to 1
grad_clip_norm: 1.0

# ---- modality ablation ---------------------------------------- #
modalities: ["T1", "QSM"]

# ---- loss --------------------------------------------------------------- #
ce_weight: 1.0
dice_weight: 1.0

# ---- bookkeeping -------------------------------------------------------- #
checkpoint_dir: "checkpoints/subject_clean_v1/D2_t1_qsm_seed123"
results_dir: "results/experiments_subject_clean_v1/D2_t1_qsm_seed123"
