# Experiment C — STN-specific Boundary-aware Loss v1.
#
# This file is configs/baseline_v1.yaml with EXACTLY these changes:
#   1. loss_type adds the STN signed-distance boundary term
#   2. boundary_weight / boundary_class set that term
#   3. boundary_cache_dir points at the precomputed signed-distance maps
#   4. checkpoint_dir / results_dir point at the experiment directories
#   5. pin_memory: false  (environment workaround, NOT an experimental variable)
#
# The baseline objective is NOT replaced. CE and the foreground soft Dice over
# STN/SN/RN are exactly Baseline v1's; the boundary term is additive. So this
# experiment tests "does adding boundary supervision help", not "is some other
# loss better".
#
# `augmentation_enabled` is deliberately ABSENT rather than set to false: the
# default is already false, and leaving it out keeps the config diff minimal.
# A test asserts the diff is exactly the five items above.

# ---- data --------------------------------------------------------------- #
root: "."
cache_dir: "cache/baseline_v1"
manifest_dir: "manifests/subject_clean_v1"

# ---- model -------------------------------------------------------------- #
base_channels: 16
in_channels: 3
num_classes: 4

# ---- optimisation ------------------------------------------------------- #
seed: 42
batch_size: 2
learning_rate: 3.0e-4
weight_decay: 1.0e-5
amp: true
max_epochs: 200
early_stopping_patience: 40
num_workers: 0
# Environment workaround, NOT an experimental variable.
# This machine has ~15.6 GB of RAM and is heavily loaded; the pinned-memory
# allocator can then fail and PyTorch reports it as "CUDA error: out of memory"
# even with plenty of free VRAM. pin_memory only controls whether host staging
# buffers are page-locked, so setting it false cannot change any weight, loss or
# metric -- the comparison against the baseline stays valid.
pin_memory: false
grad_accumulation_steps: 1
grad_clip_norm: 1.0

# ---- loss --------------------------------------------------------------- #
# THE ONLY ALGORITHMIC CHANGE: one additive term.
#
#     total = 1.0 * CE
#           + 1.0 * foreground soft Dice (STN, SN, RN -- Baseline v1's own code)
#           + lambda * mean(p_STN * phi)
#
# where phi is the STN ground-truth signed distance map in millimetres, clipped
# to [-10, +10] and divided by 10, negative INSIDE the GT and positive OUTSIDE.
#
#     inside GT    phi < 0  ->  raising p_STN lowers the term
#     outside GT   phi > 0  ->  raising p_STN raises the term
#     at the edge  phi ~ 0  ->  the voxel barely matters
#
# so the term penalises probability mass by how far it sits from the true
# boundary, which neither CE nor Dice does (both weight every wrong voxel
# equally). This targets the error the analysis actually found: STN's Dice
# correlates with HD95 at r = -0.656, i.e. its dominant error is at the edge.
#
# Rationale for testing this at all: Experiments A and B both moved the
# predicted/GT volume ratio towards 1.0 without improving STN Dice, which
# suggests the problem is not the FP/FN tradeoff that those losses control.
loss_type: "stn_boundary"
boundary_weight: 0.10   # lambda; the ONLY value run. No sweep.
boundary_class: 1       # 1 = STN (data.crop_spec.CLASS_NAMES)
boundary_cache_dir: "cache/boundary_v1/stn_signed_distance"

ce_weight: 1.0          # unchanged from Baseline v1
dice_weight: 1.0        # unchanged from Baseline v1

# ---- bookkeeping -------------------------------------------------------- #
checkpoint_dir: "checkpoints/subject_clean_v1/C_boundary"
results_dir: "results/experiments_subject_clean_v1/C_boundary"
