# Experiment E - spatial prior: coordinates + occupancy prior.
#
# This file is configs/baseline_v1.yaml with EXACTLY these changes:
#   1. spatial_prior_mode and spatial_prior_cache_dir
#   2. checkpoint_dir / results_dir point at the spatial-prior directories
#   3. pin_memory: false  (environment workaround, NOT an experimental variable)
#
# The ONLY algorithmic difference from E0 is the extra input channels appended by
# the prior wrapper. Loss, optimiser, lr, batch, crop, seed, split, schedule and
# checkpoint criterion are the frozen Baseline v1 values.
#
# Channel order is [T1, QSM, NM, <priors>] -- priors are APPENDED, never
# prepended, so channel 0 stays T1 for the existing prediction overlays.
#
# augmentation must stay false: nothing in the augmentation pipeline transforms a
# prior, so an augmented image would no longer line up with its coordinates or its
# occupancy map. The loader raises if both are requested.
#
# Naming: the occupancy channels are an EMPIRICAL SPATIAL PRIOR / training-set
# occupancy map, estimated from the 161 subject-clean development-train cases. They are NOT an
# anatomical atlas and NOT a registered probability atlas -- this project performs
# no cross-subject registration; the 160 cases share a voxel grid, not a common
# anatomical space.
#
# internal_test and challenge_test are not read. Note for the record: the
# internal_test labels were previously used for a geometric / crop-coverage audit,
# not for model-performance evaluation.

# ---- data --------------------------------------------------------------- #
root: "."
cache_dir: "cache/baseline_v1"
manifest_dir: "manifests/subject_clean_v1"

# ---- model -------------------------------------------------------------- #
base_channels: 16          # 16 -> 32 -> 64 -> 128 -> 256
# in_channels is NOT set here -- it is derived as image modalities + prior channels.
num_classes: 4             # 0 background, 1 STN, 2 SN, 3 RN

# ---- optimisation ------------------------------------------------------- #
seed: 42
batch_size: 2              # provisional; confirmed by the VRAM smoke test
learning_rate: 3.0e-4
weight_decay: 1.0e-5
amp: true
max_epochs: 200
early_stopping_patience: 40
num_workers: 0             # Windows + small cache: keep in-process
# Environment workaround, NOT an experimental variable. This machine has
# ~15.6 GB of RAM and is heavily loaded; the pinned-memory allocator can then
# fail and PyTorch reports it as "CUDA error: out of memory" even with free
# VRAM. pin_memory only controls whether host staging buffers are page-locked,
# so setting it false cannot change any weight, loss or metric.
pin_memory: false
grad_accumulation_steps: 1 # raise if batch_size has to drop to 1
grad_clip_norm: 1.0

# ---- spatial prior -------------------------------------------- #
spatial_prior_mode: "both"
spatial_prior_cache_dir: "cache/spatial_prior_v1_subject_clean"

# ---- loss --------------------------------------------------------------- #
ce_weight: 1.0
dice_weight: 1.0

# ---- bookkeeping -------------------------------------------------------- #
checkpoint_dir: "checkpoints/subject_clean_v1/E_e3_both"
results_dir: "results/experiments_subject_clean_v1/E_e3_both"
