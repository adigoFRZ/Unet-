# Baseline v1 configuration.
#
# This is the reference baseline. Everything here is intentionally plain: any
# improvement (class weighting, augmentation, attention, deep supervision, ...)
# belongs in a SEPARATE config so that the baseline stays attributable.
#
# Only development train (160) and development val (40) are ever read.
# internal_test and challenge_test are reserved and are NOT reachable.

# ---- data --------------------------------------------------------------- #
root: "."
cache_dir: "cache/baseline_v1"
manifest_dir: "manifests/subject_clean_v1"

# ---- model -------------------------------------------------------------- #
base_channels: 16          # 16 -> 32 -> 64 -> 128 -> 256
in_channels: 3             # T1, QSM, NM  (channel order fixed in data.crop_spec)
num_classes: 4             # 0 background, 1 STN, 2 SN, 3 RN

# ---- optimisation ------------------------------------------------------- #
seed: 42
batch_size: 2              # provisional; confirmed by the VRAM smoke test
learning_rate: 3.0e-4
weight_decay: 1.0e-5
amp: true
max_epochs: 200
early_stopping_patience: 40
num_workers: 0             # Windows + small cache: keep in-process
grad_accumulation_steps: 1 # raise if batch_size has to drop to 1
grad_clip_norm: 1.0

# ---- loss --------------------------------------------------------------- #
ce_weight: 1.0
dice_weight: 1.0

# ---- bookkeeping -------------------------------------------------------- #
checkpoint_dir: "checkpoints/subject_clean_v1/baseline_v1"
results_dir: "results/experiments_subject_clean_v1/baseline_v1"
